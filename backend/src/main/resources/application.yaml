spring:
  application:
    name: vantan-backend

  # ─── JPA ────────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway maneja el schema, Hibernate solo valida
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        spring:
          jpa:
            open-in-view: false
  # ─── Flyway ─────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ─── Cache ──────────────────────────────────────────────────────────────────
  cache:
    type: redis

# ─── Actuator ───────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

# ─── SpringDoc ──────────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ─── JWT (valores por defecto, sobreescritos por variables de entorno) ───────
app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}