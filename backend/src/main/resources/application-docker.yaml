spring:
  datasource:
    url: jdbc:postgresql://vantan-postgres:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: vantan-redis
      port: 6379
      password: ${REDIS_PASSWORD}

server:
  port: 8080